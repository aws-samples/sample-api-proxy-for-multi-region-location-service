AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFront proxy for ALS map tiles (multi-region) - GENERATED, do not edit by hand

# Generated by scripts/generate-cloudfront-template.js from ENABLED_REGIONS:
#   ap-northeast-1, eu-west-1, us-east-1

Resources:
  ApNortheast1AppendKeyFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-ApNortheast1-AppendKey"
      AutoPublish: true
      FunctionConfig:
        Comment: Inject ap-northeast-1 Location API Key and strip region prefix
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub
        - |
          function handler(event) {
            var request = event.request;
            request.uri = request.uri.slice('/ap-northeast-1'.length);
            request.querystring['key'] = { value: '${ApiKeyValue}' };
            return request;
          }
        - ApiKeyValue: !Sub "{{resolve:secretsmanager:location-proxy/api-keys:SecretString:ap-northeast-1}}"

  EuWest1AppendKeyFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-EuWest1-AppendKey"
      AutoPublish: true
      FunctionConfig:
        Comment: Inject eu-west-1 Location API Key and strip region prefix
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub
        - |
          function handler(event) {
            var request = event.request;
            request.uri = request.uri.slice('/eu-west-1'.length);
            request.querystring['key'] = { value: '${ApiKeyValue}' };
            return request;
          }
        - ApiKeyValue: !Sub "{{resolve:secretsmanager:location-proxy/api-keys:SecretString:eu-west-1}}"

  UsEast1AppendKeyFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-UsEast1-AppendKey"
      AutoPublish: true
      FunctionConfig:
        Comment: Inject us-east-1 Location API Key and strip region prefix
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub
        - |
          function handler(event) {
            var request = event.request;
            request.uri = request.uri.slice('/us-east-1'.length);
            request.querystring['key'] = { value: '${ApiKeyValue}' };
            return request;
          }
        - ApiKeyValue: !Sub "{{resolve:secretsmanager:location-proxy/api-keys:SecretString:us-east-1}}"

  CachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-MapTileCache"
        DefaultTTL: 86400
        MaxTTL: 604800
        MinTTL: 3600
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true

  OriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-ForwardApiKey"
        CookiesConfig: { CookieBehavior: none }
        HeadersConfig: { HeaderBehavior: none }
        QueryStringsConfig:
          QueryStringBehavior: whitelist
          QueryStrings: [key]

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: ALS Map Tile Proxy (multi-region)
        DefaultCacheBehavior:
          TargetOriginId: ApNortheast1Origin
          ViewerProtocolPolicy: https-only
          CachePolicyId: !Ref CachePolicy
          OriginRequestPolicyId: !Ref OriginRequestPolicy
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ApNortheast1AppendKeyFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /ap-northeast-1/*
            TargetOriginId: ApNortheast1Origin
            ViewerProtocolPolicy: https-only
            CachePolicyId: !Ref CachePolicy
            OriginRequestPolicyId: !Ref OriginRequestPolicy
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ApNortheast1AppendKeyFunction.FunctionMetadata.FunctionARN
          - PathPattern: /eu-west-1/*
            TargetOriginId: EuWest1Origin
            ViewerProtocolPolicy: https-only
            CachePolicyId: !Ref CachePolicy
            OriginRequestPolicyId: !Ref OriginRequestPolicy
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt EuWest1AppendKeyFunction.FunctionMetadata.FunctionARN
          - PathPattern: /us-east-1/*
            TargetOriginId: UsEast1Origin
            ViewerProtocolPolicy: https-only
            CachePolicyId: !Ref CachePolicy
            OriginRequestPolicyId: !Ref OriginRequestPolicy
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt UsEast1AppendKeyFunction.FunctionMetadata.FunctionARN
        Origins:
          - Id: ApNortheast1Origin
            DomainName: maps.geo.ap-northeast-1.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - Id: EuWest1Origin
            DomainName: maps.geo.eu-west-1.amazonaws.com
