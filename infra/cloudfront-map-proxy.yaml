Resources:
  ApSoutheast1AppendKeyFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-ApSoutheast1-AppendKey"
      AutoPublish: true
      FunctionConfig:
        Comment: Inject ap-southeast-1 Location API Key and strip region prefix
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub
        - |
          function handler(event) {
            var request = event.request;
            request.uri = request.uri.slice('/ap-southeast-1'.length);
            request.querystring['key'] = { value: '${ApiKeyValue}' };
            return request;
          }
        - ApiKeyValue: !Sub "{{resolve:secretsmanager:location-proxy/api-keys:SecretString:ap-southeast-1}}"

