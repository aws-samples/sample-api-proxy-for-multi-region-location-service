AWSTemplateFormatVersion: "2010-09-09"
Description: ECS Fargate + ALB deployment for Location Service Proxy
# Deploy this stack in the CUSTOMER'S BUSINESS REGION (near their users / ALS
# regions). Edge rate limiting is provided by an AWS WAF WebACL that — being
# CLOUDFRONT-scoped — must live in us-east-1; it is therefore created by a
# SEPARATE us-east-1 stack (infra/waf-webacl.yaml) and its ARN is passed in via
# the optional WebACLArn parameter. A CloudFront distribution is global, so this
# regional stack can attach a us-east-1 WebACL ARN without itself being in
# us-east-1.

# CloudFront managed prefix list IDs per region
# Source: https://docs.aws.amazon.com/vpc/latest/userguide/working-with-aws-managed-prefix-lists.html
Mappings:
  CloudFrontPrefixList:
    us-east-1:
      PrefixListId: pl-3b927c52
    us-east-2:
      PrefixListId: pl-b6a144df
    us-west-1:
      PrefixListId: pl-4ea04527
    us-west-2:
      PrefixListId: pl-82a045eb
    ap-northeast-1:
      PrefixListId: pl-58a04531
    ap-northeast-2:
      PrefixListId: pl-22a6434b
    ap-southeast-1:
      PrefixListId: pl-31a34658
    ap-southeast-2:
      PrefixListId: pl-b8a742d1
    ap-south-1:
      PrefixListId: pl-9aa247f3
    eu-central-1:
      PrefixListId: pl-a3a144ca
    eu-west-1:
      PrefixListId: pl-4fa04526
    eu-west-2:
      PrefixListId: pl-93a247fa
    eu-west-3:
      PrefixListId: pl-75b1541c
    eu-north-1:
      PrefixListId: pl-fab65393
    sa-east-1:
      PrefixListId: pl-5da64334
    ca-central-1:
      PrefixListId: pl-38a64351

Parameters:
  LocationApiKeysSecretArn:
    Type: String
    Description: "Secrets Manager ARN for the JSON secret {region: apiKey}"
  MapTileDomain:
    Type: String
    Description: CloudFront domain for map tiles (from cloudfront-map-proxy stack)
  MultiRegionRouting:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  AllowedOrigins:
    Type: String
    Default: ""
    Description: "CORS allowlist for /api (comma-separated origins). Empty = no cross-origin allow headers."
  ApiRatePerSec:
    Type: Number
    Default: 10
    MinValue: 0.1
    Description: Sustained per-source-IP request rate for /api (token bucket refill)
  ApiRateBurst:
    Type: Number
    Default: 20
    MinValue: 1
    Description: Per-source-IP burst capacity for /api (token bucket size)
  TrustProxy:
    Type: String
    Default: "2"
    Description: >-
      Express 'trust proxy' hop count. In this stack the chain is CloudFront→ALB
      (2 hops), so 2 makes the rate-limiter read the real, unspoofable client IP.
  ReverseGeoCacheMax:
    Type: Number
    Default: 200000
    MinValue: 1
    Description: >-
      FIFO cap for the per-task reverse-geocode grid cache (backstop against
      unbounded growth). ~few tens of MB at the default; raise for very
      geographically-diverse traffic.
  DefaultMapLanguage:
    Type: String
    Default: en
    AllowedPattern: "[a-z]{2}"
    Description: >-
      Fallback map label language (ISO 639-1 two-letter code), used only when a
      request supplies neither an explicit language nor a country to derive one
      from. Per-country defaults live in config/map-languages.js. An unsupported
      code makes the task fail at startup rather than silently rendering every
      map in English, so a typo here blocks the deploy instead of degrading it.
      Only a BARE two-letter code is accepted here — the app would also take a
      full BCP 47 tag (zh-CN) and reduce it to its primary subtag, but the
      regional part cannot affect the outcome, so this parameter rejects it
      rather than accepting a value it would silently discard.
  ImageUri:
    Type: String
    Description: ECR image URI (e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com/location-proxy:latest)
  DesiredCount:
    Type: Number
    Default: 2
    MinValue: 2
  OriginVerifySecret:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: >-
      Shared secret CloudFront injects as the X-Origin-Verify header. The ALB
      returns 403 to any request that lacks it, so the internet-facing ALB
      cannot be reached by pointing another CloudFront distribution (or direct
      client) at its DNS — traffic must flow through THIS distribution. Supply a
      long random value (e.g. `openssl rand -hex 32`); rotate by updating the
      stack. Health checks are unaffected (they hit the target directly, not via
      the listener rule).
  WebACLArn:
    Type: String
    Default: ""
    Description: >-
      Optional. ARN of a CLOUDFRONT-scoped AWS WAF WebACL (created in us-east-1
      by infra/waf-webacl.yaml) to attach to the distribution for edge rate
      limiting. Leave empty to deploy without an edge WebACL. CloudFront is
      global, so a us-east-1 WebACL ARN attaches fine even though this stack runs
      in the business region.

Conditions:
  # Attach the edge WebACL only when an ARN is supplied.
  HasWebACL: !Not [!Equals [!Ref WebACLArn, ""]]

Resources:
  # ---- VPC ----
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetARouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  SubnetBRouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # ---- Security Groups ----
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - allow HTTP from CloudFront only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !FindInMap [CloudFrontPrefixList, !Ref AWS::Region, PrefixListId]
          Description: HTTP from the CloudFront managed prefix list only
      # Explicit egress (not the implicit allow-all): the ALB only needs to reach
      # the ECS tasks on the app port. Locking this down clears cfn_nag F1000.
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          DestinationSecurityGroupId: !Ref ECSSecurityGroup
          Description: Forward to ECS tasks on the app port

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS tasks - allow traffic from ALB only
      VpcId: !Ref VPC
      # Ingress from the ALB is a SEPARATE resource (ECSFromALBIngress below), not
      # inline here: ALBSecurityGroup's egress references this group, so an inline
      # rule referencing ALBSecurityGroup back would be a circular dependency.
      # Explicit egress (not the implicit allow-all): the task calls the Amazon
      # Location Service API over HTTPS and pulls container images/secrets, all
      # over 443. Making this explicit clears cfn_nag F1000.
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS out to Amazon Location Service, ECR, and Secrets Manager

  # Standalone ingress rule (breaks the ALB<->ECS circular reference): the ALB SG
  # references ECS in its egress, so ECS's "allow from ALB" ingress lives here.
  ECSFromALBIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ECSSecurityGroup
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId: !Ref ALBSecurityGroup
      Description: App traffic from the ALB security group only

  # ---- ALB ----
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref ALBSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  # Default DENY: anything reaching the ALB without the shared secret header
  # (e.g. another CloudFront distribution pointed at this ALB's DNS, or a direct
  # client inside the CloudFront prefix list) gets a 403. Only ForwardRule below
  # — matched on the X-Origin-Verify header CloudFront injects — forwards to the
  # app. (Target-group health checks hit targets directly, bypassing this rule.)
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "403"
            ContentType: text/plain
            MessageBody: "Forbidden"

  ForwardRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values:
              - !Ref OriginVerifySecret
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ---- ECS ----
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      # CloudWatch Container Insights — off by default, so ECS CPU/memory/task
      # metrics wouldn't otherwise appear. Use "enhanced" for per-task/container
      # metrics (extra cost); "enabled" is the standard cluster-level set.
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}
      RetentionInDays: 14

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsManagerRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref LocationApiKeysSecretArn

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref AWS::StackName
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Ref ImageUri
          PortMappings:
            - ContainerPort: 3000
          Environment:
            - Name: MULTI_REGION_ROUTING
              Value: !Ref MultiRegionRouting
            - Name: MAP_TILE_DOMAIN
              Value: !Ref MapTileDomain
            - Name: ALLOWED_ORIGINS
              Value: !Ref AllowedOrigins
            - Name: API_RATE_PER_SEC
              Value: !Ref ApiRatePerSec
            - Name: API_RATE_BURST
              Value: !Ref ApiRateBurst
            - Name: TRUST_PROXY
              Value: !Ref TrustProxy
            - Name: REVERSE_GEO_CACHE_MAX
              Value: !Ref ReverseGeoCacheMax
            - Name: DEFAULT_MAP_LANGUAGE
              Value: !Ref DefaultMapLanguage
          Secrets:
            - Name: LOCATION_API_KEYS
              ValueFrom: !Ref LocationApiKeysSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  ECSService:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnetA
            - !Ref PublicSubnetB
          SecurityGroups:
            - !Ref ECSSecurityGroup
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup

  # ---- CloudFront ----
  StaticCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-StaticCache"
        DefaultTTL: 86400
        MaxTTL: 604800
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true

  # Use AWS managed CachingDisabled policy for API requests
  # Managed policy ID: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad

  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-ApiForwardAll"
        CookiesConfig:
          CookieBehavior: none
        # The CORS headers MUST be forwarded explicitly. With a cache policy +
        # origin request policy, the only headers CloudFront adds to an origin
        # request automatically are Host, User-Agent and X-Amz-Cf-Id — viewer
        # headers are NOT forwarded by default. Without `Origin` here the task
        # never sees it, so ALLOWED_ORIGINS silently does nothing through the
        # distribution (the CORS middleware short-circuits on a missing Origin)
        # and preflights come back without allow headers.
        # The API is credential-less, so no Cookie forwarding is needed.
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Origin
            - Access-Control-Request-Method
            - Access-Control-Request-Headers
        QueryStringsConfig:
          QueryStringBehavior: all

  CDN:
    Type: AWS::CloudFront::Distribution
    DependsOn: ECSService
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} - CDN for ALB"
        PriceClass: PriceClass_All
        # Serve viewers over HTTP/2 and HTTP/3 (default is http1.1). Falls back
        # to older versions for viewers that don't support them.
        HttpVersion: http2and3
        # Optional edge WAF: pass the ARN of the us-east-1 CLOUDFRONT WebACL
        # from infra/waf-webacl.yaml. Empty (default) → no WebACL attached (the
        # in-app per-task limiter + origin-verify header still apply).
        WebACLId: !If [HasWebACL, !Ref WebACLArn, !Ref "AWS::NoValue"]
        Origins:
          - Id: ALBOrigin
            DomainName: !GetAtt ALB.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
            # Shared secret proving a request came through THIS distribution.
            # The ALB's ForwardRule requires it; without it the ALB returns 403.
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginVerifySecret
        DefaultCacheBehavior:
          TargetOriginId: ALBOrigin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: !Ref StaticCachePolicy
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            # The API is read-only (every endpoint is a GET); OPTIONS is here for
            # CORS preflights. Mutating methods are not allowed at the edge so
            # they never reach the origin at all.
            AllowedMethods: [GET, HEAD, OPTIONS]
            Compress: true
          - PathPattern: /health
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            AllowedMethods: [GET, HEAD]
            Compress: true

  # ---- Auto Scaling ----
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ResourceId: !Sub service/${ECSCluster}/${ECSService.Name}
      ScalableDimension: ecs:service:DesiredCount
      MinCapacity: !Ref DesiredCount
      MaxCapacity: 10
      RoleARN: !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService

  ScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: cpu-tracking
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 60
        ScaleInCooldown: 120
        ScaleOutCooldown: 60

Outputs:
  ServiceUrl:
    Description: Application URL (CloudFront)
    Value: !Sub https://${CDN.DomainName}
  ALBUrl:
    Description: >-
      ALB URL (internal — returns 403 unless the X-Origin-Verify header is
      present; only THIS CloudFront distribution injects it). Do not expose.
    Value: !Sub http://${ALB.DNSName}
  AttachedWebACLArn:
    Condition: HasWebACL
    Description: WAF WebACL attached to the distribution (edge rate limiting)
    Value: !Ref WebACLArn
  CloudFrontDistributionId:
    Value: !Ref CDN
  ClusterName:
    Value: !Ref ECSCluster
  ServiceName:
    Value: !GetAtt ECSService.Name
