<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazon Location Service Proxy</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #map { width: 100vw; height: 100vh; }

    .search-box {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      width: 420px; z-index: 10;
    }
    .search-row { display: flex; gap: 6px; }
    .search-row input {
      padding: 12px 16px; font-size: 15px;
      border: none; border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      outline: none;
    }
    #country-input { width: 110px; flex: 0 0 auto; text-transform: uppercase; }
    #search-input { flex: 1 1 auto; }
    .follow-toggle {
      display: block; margin-top: 6px; padding: 6px 10px;
      background: #fff; border-radius: 8px; font-size: 12px; color: #555;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15); cursor: pointer;
    }
    .suggestions {
      margin-top: 4px; background: #fff; border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      overflow: hidden; display: none;
    }
    .suggestions.active { display: block; }
    .suggestion-item {
      padding: 10px 16px; cursor: pointer; font-size: 14px;
      border-bottom: 1px solid #f0f0f0;
    }
    .suggestion-item:hover { background: #f5f7fa; }
    .suggestion-item .main { font-weight: 500; }
    .suggestion-item .sub { color: #888; font-size: 12px; margin-top: 2px; }

    .info-panel {
      position: absolute; bottom: 24px; left: 16px;
      background: #fff; border-radius: 8px; padding: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      max-width: 360px; display: none; font-size: 14px; z-index: 10;
    }
    .info-panel.active { display: block; }
    .info-panel h3 { margin-bottom: 8px; font-size: 15px; }
    .info-panel p { color: #555; line-height: 1.5; }
    .locate-btn {
      position: absolute; bottom: 24px; right: 16px; z-index: 10;
      width: 44px; height: 44px; border-radius: 50%; border: none;
      background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      cursor: pointer; font-size: 20px;
    }
    .locate-btn:hover { background: #f0f0f0; }

    .style-switcher {
      position: absolute; top: 16px; right: 56px; z-index: 10;
      display: flex; gap: 4px;
      background: #fff; border-radius: 8px; padding: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    .style-btn {
      padding: 6px 12px; border: none; border-radius: 6px;
      background: transparent; cursor: pointer; font-size: 13px;
      color: #555; white-space: nowrap;
    }
    .style-btn:hover { background: #f0f0f0; }
    .style-btn.active { background: #0073bb; color: #fff; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="search-box">
    <div class="search-row">
      <input id="country-input" type="text" placeholder="国家(如 SG)" maxlength="3" autocomplete="off"
        title="可选：ISO 国家代码。填了则按该国精确过滤(演示业务系统传 countryCode)。" />
      <input id="search-input" type="text" placeholder="🔍 搜索地址..." autocomplete="off" />
    </div>
    <div id="suggestions" class="suggestions"></div>
    <label class="follow-toggle" title="选中某国结果后，自动把该国代码填入国家框，后续搜索沿用该国上下文。关闭则每次都从 HOME 全球搜索。">
      <input type="checkbox" id="context-follow" checked /> 跟随所选结果的国家上下文
    </label>
  </div>

  <div id="info-panel" class="info-panel">
    <h3 id="info-title"></h3>
    <p id="info-address"></p>
    <p id="info-coords" style="color:#aaa;font-size:12px;margin-top:4px;"></p>
  </div>

  <button class="locate-btn" id="locate-btn" title="定位到当前位置">📍</button>

  <div class="style-switcher" id="style-switcher"></div>

  <script>
    let map, marker;
    // Frontend-owned display names for style ids (the backend returns only ids).
    const STYLE_LABELS = { Standard: "标准", Monochrome: "单色", Hybrid: "混合", Satellite: "卫星" };
    // The region whose tiles are currently shown. Starts at the home region
    // (map-config), and switches when a search result in another region is
    // selected. Kept explicit so we never infer routing from the map center.
    let activeRegion = null;
    let currentStyle = "Standard";
    // User's real location (from the locate button), used as the search bias.
    // NOT the map center — the map center only reflects "what I last looked at".
    let userLocation = null;

    // Optional country code: from the demo dropdown, or a host page setting
    // window.COUNTRY_CODE. Empty string when not set.
    function countryCode() {
      const fromInput = (document.getElementById("country-input").value || "").trim().toUpperCase();
      return fromInput || window.COUNTRY_CODE || "";
    }

    // Build the shared routing query params per the API contract:
    // countryCode (highest priority) OR user location lat/lng; else nothing (HOME).
    function routingParams() {
      const p = new URLSearchParams();
      const cc = countryCode();
      if (cc) {
        p.set("countryCode", cc);
      } else if (userLocation) {
        p.set("lat", userLocation.lat);
        p.set("lng", userLocation.lng);
      }
      return p;
    }

    async function init() {
      // Initial map view comes from the backend (home region's center), so the
      // map opens inside the region's coverage instead of a hardcoded default.
      const cfgRes = await fetch("/api/map-config");
      const mapConfig = await cfgRes.json();
      activeRegion = mapConfig.region; // home region initially drives the tiles

      // Load available map style ids and render switcher buttons. Display names
      // are a UI concern owned by the frontend (the backend returns only ids).
      const stylesRes = await fetch("/api/map-styles");
      const styleIds = await stylesRes.json();
      const switcher = document.getElementById("style-switcher");
      styleIds.forEach((id, i) => {
        const btn = document.createElement("button");
        btn.className = "style-btn" + (i === 0 ? " active" : "");
        btn.dataset.style = id;
        btn.textContent = STYLE_LABELS[id] || id;
        switcher.appendChild(btn);
      });

      // Required for rendering RTL text (Arabic, Hebrew, etc.) in map labels
      maplibregl.setRTLTextPlugin(
        'https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.min.js',
        null,
        true // lazy load
      );

      map = new maplibregl.Map({
        container: "map",
        // Style is proxied through Express: descriptor fetched server-side,
        // tile URLs rewritten to CloudFront, API key never exposed to browser
        style: "/api/map-style",
        center: mapConfig.center, // home region center (from /api/map-config)
        zoom: mapConfig.zoom,
      });
      map.addControl(new maplibregl.NavigationControl(), "top-right");

      map.on('error', (e) => console.error('Map error:', e.error));
      map.once('styledata', () => {
        map.resize();
        map.triggerRepaint();
      });
    }

    function setMarker(lng, lat, title, zoom, noFly) {
      if (marker) marker.remove();
      marker = new maplibregl.Marker({ color: "#FF4444" })
        .setLngLat([lng, lat])
        .setPopup(new maplibregl.Popup().setText(title || ""))
        .addTo(map);
      marker.togglePopup();
      // When a tile-region switch is in progress, the styledata callback sets
      // the final view — flying here too would fight it. noFly skips the fly.
      if (!noFly) map.flyTo({ center: [lng, lat], zoom: zoom || 12 });
    }

    function showInfo(title, address, lng, lat) {
      document.getElementById("info-title").textContent = title;
      document.getElementById("info-address").textContent = address || "";
      document.getElementById("info-coords").textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
      document.getElementById("info-panel").classList.add("active");
    }

    // Debounced search
    let timer;
    const input = document.getElementById("search-input");
    const sugBox = document.getElementById("suggestions");

    input.addEventListener("input", () => {
      clearTimeout(timer);
      const q = input.value.trim();
      if (!q) { sugBox.classList.remove("active"); return; }
      timer = setTimeout(() => fetchSuggestions(q), 300);
    });

    input.addEventListener("focus", () => {
      if (sugBox.children.length) sugBox.classList.add("active");
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-box")) sugBox.classList.remove("active");
    });

    async function fetchSuggestions(query) {
      // Routing signals per the contract: countryCode / user location / neither.
      // The map center is deliberately NOT used.
      const params = routingParams();
      params.set("query", query);
      try {
        const res = await fetch(`/api/suggest?${params}`);
        const items = await res.json();
        // Guard against a non-array (e.g. an error object) so a bad response
        // can never throw here and freeze the input handler.
        if (!Array.isArray(items)) throw new Error(items && items.error ? items.error : "bad response");

        sugBox.innerHTML = "";
        items.forEach((item) => {
          const div = document.createElement("div");
          div.className = "suggestion-item";

          const addr = item.address;
          const subText = addr ? [addr.District, addr.Municipality, addr.Region, addr.Country?.Name].filter(Boolean).join(", ") : "";

          div.innerHTML = `<div class="main">${item.text}</div><div class="sub">${subText}</div>`;
          div.addEventListener("click", () => selectSuggestion(item));
          sugBox.appendChild(div);
        });
        sugBox.classList.toggle("active", items.length > 0);
      } catch (err) {
        console.error("Suggest failed:", err);
        sugBox.innerHTML = "";
        sugBox.classList.remove("active");
      }
    }

    // Switch the map tiles to a region (e.g. a selected result's region).
    // Returns true if a switch was started, false if already on that region.
    // `view` (optional {center:[lng,lat], zoom}) is the view to apply AFTER the
    // new style loads — pass the result location so setStyle doesn't clobber it.
    function switchTileRegion(region, view) {
      if (!region || region === activeRegion) return false;
      activeRegion = region;
      const target = view || { center: map.getCenter().toArray(), zoom: map.getZoom() };
      map.setStyle(`/api/map-style?style=${currentStyle}&region=${encodeURIComponent(region)}`);
      map.once("styledata", () => {
        map.setCenter(target.center);
        map.setZoom(target.zoom);
        map.resize();
        map.triggerRepaint();
      });
      return true;
    }

    // Show a result: mark it, show info, and switch tiles to the region whose
    // map data covers it. If we switch tiles, the target view is applied after
    // the new style loads (so the style reload doesn't clobber the location);
    // otherwise we fly there directly.
    function showResult({ lng, lat, title, infoAddr, tileRegion, country }) {
      const view = { center: [lng, lat], zoom: 15 };
      showInfo(title, infoAddr, lng, lat);
      const switching = switchTileRegion(tileRegion, view);
      if (switching) {
        setMarker(lng, lat, title, view.zoom, /*noFly*/ true);
        map.jumpTo(view); // final view is set by switchTileRegion's styledata cb
      } else {
        setMarker(lng, lat, title, view.zoom);
      }
      // Context follow (demo behavior): backfill the country box with the
      // result's country so subsequent searches stay in that country. The box
      // is the single visible source of context — clear it to search globally.
      const follow = document.getElementById("context-follow").checked;
      if (follow && country) {
        document.getElementById("country-input").value = country;
      }
    }

    async function selectSuggestion(item) {
      sugBox.classList.remove("active");
      input.value = item.text;
      try {
        // HERE suggestions carry a position (no GetPlace needed); resolve the
        // result's tile region from its coordinate.
        if (item.position) {
          const [lng, lat] = item.position;
          const addr = item.address;
          const tr = await fetch(`/api/tile-region?lat=${lat}&lng=${lng}`).then((r) => r.json());
          showResult({
            lng, lat, title: item.text,
            infoAddr: addr ? [addr.Street, addr.District, addr.Municipality].filter(Boolean).join(" ") : "",
            tileRegion: tr.tileRegion, country: tr.country,
          });
          return;
        }

        // GrabMaps suggestions omit position → GetPlace (region-scoped: pass the
        // region that produced the PlaceId). The response's tileRegion tells us
        // which region's tiles cover the result.
        if (!item.placeId) return;
        const regionParam = item.region ? `?region=${encodeURIComponent(item.region)}` : "";
        const place = await fetch(`/api/place/${item.placeId}${regionParam}`).then((r) => r.json());
        if (place.position) {
          const [lng, lat] = place.position;
          showResult({
            lng, lat, title: place.label,
            infoAddr: place.address ? place.address.Label : "",
            tileRegion: place.tileRegion, country: place.country,
          });
        }
      } catch (err) {
        console.error("Select failed:", err);
      }
    }

    // Style switcher — changes style but keeps the current tile region.
    document.getElementById("style-switcher").addEventListener("click", async (e) => {
      const btn = e.target.closest(".style-btn");
      if (!btn) return;
      const styleName = btn.dataset.style;
      if (styleName === currentStyle) return;

      currentStyle = styleName;
      document.querySelectorAll(".style-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      const center = map.getCenter();
      const zoom = map.getZoom();
      const regionParam = activeRegion ? `&region=${encodeURIComponent(activeRegion)}` : "";
      map.setStyle(`/api/map-style?style=${styleName}${regionParam}`);
      map.once("styledata", () => {
        map.setCenter(center);
        map.setZoom(zoom);
        map.resize();
        map.triggerRepaint();
      });
    });

    // Geolocation — records the user's REAL location as the search bias
    // (distinct from the map center) and centers the map on it.
    document.getElementById("locate-btn").addEventListener("click", () => {
      if (!navigator.geolocation) return alert("浏览器不支持定位");
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { longitude: lng, latitude: lat } = pos.coords;
          userLocation = { lat, lng };
          setMarker(lng, lat, "我的位置");
          showInfo("我的位置", "当前设备定位", lng, lat);
        },
        (err) => alert("定位失败: " + err.message),
        { enableHighAccuracy: true }
      );
    });

    init();
  </script>
</body>
</html>
